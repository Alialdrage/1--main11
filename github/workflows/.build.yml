name: Android CI Direct Link

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission
      run: chmod +x gradlew

    - name: Build All APK Variants
      run: ./gradlew assembleDebug

    # خطوة رفع الملف التقليدية
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      id: artifact-upload
      with:
        name: my-app-apk
        path: "**/build/outputs/apk/debug/*.apk"

    # خطوة الخدعة الذكية: طباعة رابط التحميل في السجل الصريح
    - name: Display Direct Download Link
      run: |
        echo "========================================================"
        echo "رابط التحميل المباشر لملف التطبيق الخاص بك هو بالأسفل:"
        echo "${{ steps.artifact-upload.outputs.artifact-url }}"
        echo "========================================================"
